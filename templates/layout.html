<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}My Planner{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <style>
        body {
            background: #f5f7fa;
        }

        /* Planner styles */
        .planner-container {
            padding: 20px 0 40px;
        }
        .planner-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .planner-table {
            min-width: 900px;
        }
        .planner-slot:hover {
            background: #e9f1ff;
        }
    </style>

    {% block head_extra %}{% endblock %}
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <!-- FIXED: takes user to welcome/home page -->
        <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">My Planner</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('planner') }}">Planner</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('canvas.canvas_page') }}">Canvas</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/spotify">Spotify</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/pomodoro">Pomodoro Timer</a>
                </li>

            </ul>
        </div>
    </div>
</nav>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% block scripts %}{% endblock %}
</body>
</html>
